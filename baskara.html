<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Baskara</h1>

    <input type="text" id="aValue" />x²
    <input type="text" id="bValue" />x
    <input type="text" id="cValue" /> = 0
    <br />
    <input type="button" onclick="calcular()" value="Calcular" />

    <script>    
       function calcular() {
        let valorA = document.getElementById("aValue").value
        let valorB = document.getElementById("bValue").value
        let valorC = document.getElementById("cValue").value

       let delta = valorB * valorB - 4 * valorA * valorC
       valorB = valorB * -1
       
       if(delta < 0){
        alert("Erro: Delta menor que zero")
       }

       else if (delta > 0){
        delta = delta ** 0.5
        let x1 = (valorB + delta) / 2 * valorA
       let x2 = (valorB - delta) / 2 * valorA
       alert("X¹ = ", x1, "X² = ", x2)
       }
       
       else {
        let x1 = valorB / 2 * valorA
        alert ("X¹ = ", x1)
       }

        }
      
    </script>

</body>
</html>
